</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="2" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<h1 id="introducci%C3%B3n-al-aprendizaje-estad%C3%ADstico">Introducción al Aprendizaje Estadístico</h1>
<p>El <strong>aprendizaje estadístico</strong> (AE) es una disciplina crucial en ciencia de datos, que fusiona herramientas estadísticas y computacionales para <strong>analizar, aprender y predecir a partir de conjuntos de datos complejos</strong>. Su enfoque es la <strong>construcción de modelos para aprendizaje y predicción desde una perspectiva estadística</strong>, considerando la <strong>incertidumbre</strong> de la información incompleta.</p>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="3" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<h1 id="%C2%BFqu%C3%A9-es-el-aprendizaje-estad%C3%ADstico">¿Qué es el Aprendizaje Estadístico?</h1>
<p>El aprendizaje estadístico surge desde la <strong>estadística computacional</strong>, centrándose en la <strong>incertidumbre y el origen de los datos</strong>, a diferencia del aprendizaje automático (ML) que históricamente se enfoca en la predicción algorítmica. Sin embargo, en la práctica, <strong>ambos términos se consideran generalmente sinónimos</strong>.</p>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="4" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<h3 id="objetivos-y-caracter%C3%ADsticas-clave">Objetivos y Características Clave:</h3>
<ul>
<li><strong>Predicción</strong>: Su fin primordial es predecir nuevas observaciones.</li>
<li><strong>Flexibilidad</strong>: Concluye basándose solo en los datos, sin suposiciones <em>a priori</em>, dejando que los datos &quot;hablen&quot;.</li>
<li><strong>Procesamiento Automático de Datos</strong>: El aprendizaje busca ser automatizado, minimizando la intervención humana.</li>
<li><strong>&quot;Big Data&quot;</strong>: Diseñado para manejar &quot;grandes datos&quot; en amplio sentido: grandes muestras, alta dimensionalidad, datos complejos o que requieren alta velocidad.</li>
<li><strong>Optimización</strong>: Al igual que ML, usa extensivamente la programación matemática, formulando problemas como optimización de funciones con restricciones.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="5" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<h1 id="desaf%C3%ADos-del-aprendizaje-estad%C3%ADstico">Desafíos del Aprendizaje Estadístico</h1>
<ul>
<li><strong>Interpretabilidad</strong>: Métodos flexibles pueden ser &quot;cajas negras&quot;, dificultando entender cómo se generan las predicciones o los efectos de los predictores. A menudo, se sacrifica la interpretabilidad por la precisión predictiva.</li>
<li><strong>Reproducibilidad/Repetibilidad</strong>: Pequeños cambios en los datos o en la &quot;semilla&quot; aleatoria pueden causar cambios notables en el modelo.</li>
<li><strong>Cuantificación de la Incertidumbre</strong>: Es difícil cuantificar la precisión de una predicción específica (ej. intervalos de predicción).</li>
<li><strong>Inferencia</strong>: La mayoría de los métodos no permiten inferencias poblacionales (ej. contrastes de hipótesis) más allá de la predicción.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="6" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<ul>
<li><strong>Sobreajuste (Overfitting)</strong>: Modelos flexibles pueden ajustarse &quot;demasiado bien&quot; a los datos de entrenamiento, siendo ineficientes para predecir nuevas observaciones. Es un problema crucial en AE, a diferencia de los métodos clásicos donde el infraajuste es más común.</li>
<li><strong>Extrapolación/Interpolación</strong>: Algoritmos flexibles pueden tener más problemas al extrapolar o interpolar a nuevas observaciones muy alejadas de los datos de entrenamiento.</li>
<li><strong>Maldición de la Dimensionalidad</strong>: Al aumentar las variables explicativas, pueden agravarse problemas como la colinealidad o el &quot;efecto frontera&quot;, especialmente para modelos flexibles.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="7" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<h1 id="aprendizaje-supervisado-y-no-supervisado">Aprendizaje Supervisado y No Supervisado</h1>
<h3 id="aprendizaje-supervisado">Aprendizaje Supervisado:</h3>
<ul>
<li>Métodos <strong>predictivos</strong> con una <strong>variable respuesta (o variable objetivo)</strong> explícitamente definida.</li>
<li>Construye modelos para <strong>hacer predicciones</strong> sobre datos no vistos.</li>
<li>Aprende patrones de <strong>datos de entrenamiento etiquetados</strong> para aplicarlos a información no vista.</li>
<li>Ejemplos: clasificación y regresión.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="8" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<h3 id="aprendizaje-no-supervisado">Aprendizaje No Supervisado:</h3>
<ul>
<li>Métodos <strong>exploratorios</strong> donde <strong>no hay una variable respuesta explícita</strong>.</li>
<li>Busca <strong>entender las relaciones y estructuras presentes en los datos</strong>.</li>
<li>Agrupa datos de entrada en clases basándose solo en sus propiedades estadísticas.</li>
<li>Categorías: análisis descriptivo, reducción de la dimensión (PCA), agrupación (análisis clúster), y detección de datos atípicos.</li>
</ul>
<footer>Aprendizaje Estadístico</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-header="Introducción" data-footer="Aprendizaje Estadístico" data-paginate="true" data-heading-divider="2" data-theme="953735obpdmyb4940avun47guls43e4e7p28w9yug2v" data-marpit-pagination="9" data-marpit-pagination-total="21" style="--header:Introducción;--footer:Aprendizaje Estadístico;--paginate:true;--heading-divider:2;--theme:953735obpdmyb4940avun47guls43e4e7p28w9yug2v;">
<header>Introducción</header>
<h1 id="regresi%C3%B3n-y-clasificaci%C3%B3n">Regresión y Clasificación</h1>
<h3 id="regresi%C3%B3n">Regresión</h3>

<li>El objetivo es modelar la relación entre las variables, por ejemplo, mediante una función lineal o no lineal.</li>
<li><strong>Ejemplo</strong>: Predecir el precio de una vivienda (valor continuo) según su tamaño, número de habitaciones.</li>

</ul>

<header>Introducción</header>
<p>Donde:</p>

<h3 id="clasificaci%C3%B3n">Clasificación</h3>

<li>Su objetivo es <strong>ordenar los datos en categorías predefinidas</strong>.</li>
<li><strong>Ejemplo</strong>: Clasificar un email como &quot;spam&quot; o &quot;no spam&quot;.</li>

<h1 id="ejemplo-num%C3%A9rico-conceptual-regresi%C3%B3n-lineal-simple">Ejemplo Numérico Conceptual: Regresión Lineal Simple</h1>
<p>Los siguientes ejemplos ilustran ideas fundamentales con cálculos sencillos, no el proceso completo de entrenamiento de un algoritmo complejo.</p>

<header>Introducción</header>
<p>En clasificación, buscamos una regla o un <strong>hiperplano (una frontera)</strong> que separe las categorías. Para un ejemplo simple, podríamos proponer una regla basada en un umbral:</p>

<header>Introducción</header>
<h1 id="evaluaci%C3%B3n-de-clasificaci%C3%B3n-matriz-de-confusi%C3%B3n">Evaluación de Clasificación: Matriz de Confusión</h1>
<p>Evaluemos la regla usando una <strong>matriz de confusión</strong>, que compara las predicciones con los valores reales:</p>
<table>
<thead>
<tr>

</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Observado: Comprador</td>

</tr>
<tr>
<td style="text-align:left">Observado: No Comprador</td>

</tr>
</tbody>
</table>

</section>

<header>Introducción</header>
<p>Aplicando nuestra regla a los datos:</p>
<ul>
<li><strong>Verdaderos Positivos (TP)</strong>: Clientes &quot;Comprador&quot; predichos como &quot;Comprador&quot;. (Ingresos 30, 35, 40, 45). <strong>TP = 4</strong>.</li>
<li><strong>Falsos Negativos (FN)</strong>: Clientes &quot;Comprador&quot; predichos como &quot;No Comprador&quot;. (Ninguno). <strong>FN = 0</strong>.</li>
<li><strong>Falsos Positivos (FP)</strong>: Clientes &quot;No Comprador&quot; predichos como &quot;Comprador&quot;. (Ingresos 50, 55). <strong>FP = 2</strong>.</li>
<li><strong>Verdaderos Negativos (TN)</strong>: Clientes &quot;No Comprador&quot; predichos como &quot;No Comprador&quot;. (Ingresos 20, 25). <strong>TN = 2</strong>.</li>
</ul>

</section>
