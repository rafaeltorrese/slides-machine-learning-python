<header>Regularización</header>
<h1 id="introducci%C3%B3na-classanchor-id01-introa">Introducción<a class="anchor" id="01-intro"></a></h1>
<ul>
<li>Los conjuntos de datos de alta dimensión tienen muchas características, posiblemente mayores que el número de observaciones.</li>
<li>Muchas variables pueden ser útiles para predecir el resultado, pero puede ser difícil seleccionarlas todas.</li>
<li>Podríamos tratar de usar un procedimiento automatizado como la selección de características secuenciales para elegir características.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="4" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Para descubrir una de las posibles soluciones a este problema, aprenderemos algunas técnicas sobre <strong>regularización</strong>.</li>
<li>La regularización es el proceso de simplificación de un modelo.</li>
<li>Simplificar un modelo nos ayuda a superar problemas de gran dimensión porque nos permite descartar características que no contribuyen a la capacidad predictiva del modelo</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="5" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h2 id="ejercicio">Ejercicio</h2>
<ol>
<li>Importe la biblioteca <code>numpy</code> como <code>np</code>.</li>
<li>Importe la biblioteca <code>pandas</code> como <code>pd</code>.</li>
<li>Cargue el conjunto de datos <code>housing.csv</code> a través de la función <a href="https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html"><code>read_csv()</code></a> en <code>pandas</code> y guarde el resultado a la variable <code>housing</code>.</li>
<li>Use la función <a href="https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.dropna.html"><code>dropna()</code></a> para eliminar todas las filas con valores faltantes de <code>housing</code> .</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="6" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h1 id="reducci%C3%B3na-classanchor-id02-shrinkagea">Reducción<a class="anchor" id="02-shrinkage"></a></h1>
<ul>
<li>La regularización es el proceso de simplificar un modelo para generalizar mejor los datos no vistos. ¿Qué formas toman estas simplificaciones? Usemos la regresión lineal como ejemplo.</li>

<header>Regularización</header>
<ul>
<li>Cuantos más predictores incluimos en el modelo, más complejo se vuelve.</li>
<li>Con modelos más complejos, podemos obtener mejores predicciones, pero no necesariamente en los datos de prueba.</li>
<li>Siempre debemos tener en cuenta el sobreajuste, por lo que debemos considerar eliminar las características que no brindan poder predictivo adicional al modelo.</li>
<li>No sabemos de antemano qué características son valiosas o no, por lo que necesitamos un enfoque para eliminarlas mediante la regularización.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="8" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h2 id="ejercicio-1">Ejercicio</h2>
<ol>
<li>Importe lo siguiente:
<ul>
<li>la función <code>train_test_split</code> del módulo <code>model_selection</code>.</li>
<li>la clase <code>LinearRegression</code> del módulo <code>linear_model</code>.</li>
</ul>
</li>
<li>Quite las columnas <code>ocean_proximity</code> y <code>median_income</code> de los datos <code>housing</code> y asigne el DataFrame resultante a la variable <code>X</code>.</li>
<li>Asigne la columna <code>median_income</code> de <code>housing</code> a la variable <code>y</code>.</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="9" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ol start="4">
<li>Divida los datos <code>X</code> e <code>y</code> en un conjunto de prueba y entrenamiento, con el 20 % de los datos asignados a un conjunto de prueba.
<ul>
<li>Asigne las variables de entrenamiento a la variable <code>X_train</code>.</li>
<li>Asigne las variables de prueba a la variable <code>X_test</code>.</li>
<li>Asigne los resultados del entrenamiento a la variable <code>y_train</code>.</li>
<li>Asigne los resultados de la prueba a la variable <code>y_test</code>.</li>
<li>Establezca el parámetro <code>random_state</code> en <code>762</code>.</li>
</ul>
</li>
<li>Crea una instancia de un objeto <code>LinearRegression()</code> en la variable <code>model</code> y colócalo en los datos <code>X_train</code> e <code>y_train</code>.</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>

<header>Regularización</header>
<h1 id="regularizaci%C3%B3n-con-penalizaci%C3%B3na-classanchor-id03-penaltya">Regularización con Penalización<a class="anchor" id="03-penalty"></a></h1>
<ul>
<li>La primera extensión de la regresión lineal que aprenderemos es la <strong>regresión de cresta</strong>.</li>
<li>Un modelo de regresión de cresta tiene la misma forma que un modelo de regresión lineal, pero los valores de sus coeficientes están <em>regularizados</em> más cerca de 0.</li>
<li>Con la misma forma que la regresión lineal, ¿qué diferencia a la regresión de cresta de su primo no regularizado? La diferencia viene en la función de pérdida.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="11" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>En la regresión lineal estándar, los coeficientes se estiman minimizando el error cuadrático medio (MSE). Recuerde que el MSE es la <strong>función de pérdida</strong> para la regresión lineal y se define de la siguiente manera:</li>
</ul>

<header>Regularización</header>
<ul>
<li><code>scikit-learn</code> tiene una clase dedicada a la regresión de cresta: la <a href="https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.RidgeCV.html#sklearn.linear_model.RidgeCV">clase <code>RidgeCV</code></a>.</li>
<li>La clase <code>RidgeCV</code> también está contenida en el módulo <code>linear_model</code>, el mismo que <code>LinearRegression</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> RidgeCV
model = RidgeCV()
model.fit(X, y)
</code></pre>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="13" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h2 id="ejercicio-2">Ejercicio</h2>
<ol>
<li>Importe la clase <code>RidgeCV</code> desde el módulo <code>linear_model</code> de <code>scikit-learn</code>.</li>
<li>Crea una instancia de un objeto <code>RidgeCV()</code> donde al parámetro <code>alphas</code> se le asigna el valor <code>1</code>. Nombre este modelo <code>ridge_1</code>.</li>
<li>Crea una instancia de un objeto <code>RidgeCV()</code> donde al parámetro <code>alphas</code> se le asigna el valor <code>1000</code>. Nombre este modelo <code>ridge_1000</code>.</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="14" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ol start="4">
<li>Ajuste los modelos <code>ridge_1</code> y <code>ridge_1000</code> en los datos de entrenamiento <code>X_train</code> y <code>y_train</code>.</li>
<li>Asigne los valores de los coeficientes del modelo <code>ridge_1</code> a la variable <code>ridge_1_coef</code>.</li>
<li>Asigne los valores de los coeficientes del modelo <code>ridge_1000</code> a la variable <code>ridge_1000_coef</code>.</li>
<li>Compare los valores de los coeficientes para examinar el efecto de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container>. ¿Que notaste?</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="15" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h1 id="calibraci%C3%B3na-classanchor-id04-tunninga">Calibración<a class="anchor" id="04-tunning"></a></h1>
<ul>
<li>La regresión de cresta restringe sus coeficientes a través de un término de penalización adicional en su función de pérdida.</li>
<li>Podemos controlar cuánta regularización ocurre a través del parámetro de ajuste <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container>, pero es una buena práctica usar la validación cruzada para seleccionar uno que reduzca el error de validación.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="16" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Los valores más altos de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container> reducen más los coeficientes porque aumenta el valor del término de penalización.</li>
<li>El término de penalización obliga al modelo a comprometerse entre valores de coeficiente más altos para reducir el MSE y aumentar el valor del término de penalización.</li>
</ul>
<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -3.014ex; display: block; width: 100%; height: auto; max-height: 7.42ex;" xmlns="http://www.w3.org/2000/svg" width="47.187ex" height="7.42ex" role="img" focusable="false" viewBox="0 -1947.5 20856.5 3279.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mstyle"><g data-mml-node="mi"><path data-c="1D43F" d="M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 217 683Q271 680 344 680Q485 680 506 683H518Q524 677 524 674T522 656Q517 641 513 637H475Q406 636 394 628Q387 624 380 600T313 336Q297 271 279 198T252 88L243 52Q243 48 252 48T311 46H328Q360 46 379 47T428 54T478 72T522 106T564 161Q580 191 594 228T611 270Q616 273 628 273H641Q647 264 647 262T627 203T583 83T557 9Q555 4 553 3T537 0T494 -1Q483 -1 418 -1T294 0H116Q32 0 32 10Q32 17 34 24Q39 43 44 45Q48 46 59 46H65Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Q285 635 228 637Z"></path></g><g data-mml-node="mo" transform="translate(681,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(1070,0)"><path data-c="1D6FD" d="M29 -194Q23 -188 23 -186Q23 -183 102 134T186 465Q208 533 243 584T309 658Q365 705 429 705H431Q493 705 533 667T573 570Q573 465 469 396L482 383Q533 332 533 252Q533 139 448 65T257 -10Q227 -10 203 -2T165 17T143 40T131 59T126 65L62 -188Q60 -194 42 -194H29ZM353 431Q392 431 427 419L432 422Q436 426 439 429T449 439T461 453T472 471T484 495T493 524T501 560Q503 569 503 593Q503 611 502 616Q487 667 426 667Q384 667 347 643T286 582T247 514T224 455Q219 439 186 308T152 168Q151 163 151 147Q151 99 173 68Q204 26 260 26Q302 26 349 51T425 137Q441 171 449 214T457 279Q4  -75Q246 -125 194 -164T75 -204Q25 -204 7 -183T-12 -137Q-12 -110 7 -91T53 -71Q70 -71 82 -81T95 -112Q95 -148 63 -167Q69 -168 77 -168Q111 -168 139 -140T182 -74L193 -32Q204 11 219 72T251 197T278 308T289 365Q289 372 288 376Z"></path></g></g></g></g></g></svg></mjx-container></p><ul>
<li>La clase <code>RidgeCV</code> implementa LOOCV eficiente para encontrar el mejor valor para <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container>, pero desafortunadamente, los valores predeterminados usados por la clase no son los ideales.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="17" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Por defecto, el valor del argumento <code>alphas</code> es <code>[0.1, 1, 10]</code>.</li>
<li>Es muy probable que el mejor valor para <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container> se encuentre en algún lugar fuera de estos valores, por lo que queremos delinear un enfoque para encontrar uno.</li>
<li>Primero, podemos ejecutar <code>RidgeCV</code> con un argumento <code>alphas</code> con más valores para alfa.</li>
<li>Podemos hacer esto con la función <a href="https://numpy.org/doc/stable/reference/generated/numpy.linspace.html#numpy.linspace"><code>linspace()</code></a>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">ridge = RidgeCV(alphas = np.linspace(<span class="hljs-number">0.1</span>, <span class="hljs-number">10</span>, num=<span class="hljs-number">100</span>))
</code></pre>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="18" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>En el código anterior, asumimos que el valor correcto para <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container> está dentro del rango de <code>0.1</code> y <code>10</code>, pero ¿y si no es así? Una forma en que podremos notar esto es si uno de estos dos extremos termina siendo el valor de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container> elegido.</li>
<li>Este resultado significa que debemos cambiar los límites de <code>linspace()</code>.</li>
<li>Si originalmente elegimos un rango de valores de <code>1</code> a <code>10</code>, y el mejor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container> resulta ser <code>1</code>, podríamos querer cambiar los límites superior e inferior a <code>0.1</code> y <code>1</code>.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="19" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Idealmente, el valor óptimo estará en el medio de los límites que elija, por lo que es posible que deba experimentar un poco.</li>
<li>Una vez que encontramos un valor medio, podemos repetir este proceso usando rangos más pequeños para <code>alphas</code> para encontrar un valor con suficientes lugares decimales.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="20" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h2 id="ejercicio-3">Ejercicio</h2>
<ol>
<li>Cree un objeto <code>RidgeCV()</code> y asígnelo a la variable <code>ridge_initial</code>.
<ul>
<li>Establezca el parámetro <code>alphas</code> en <code>np.linspace(10, 100, num=100)</code>.</li>
</ul>
</li>
<li>Ajuste <code>ridge_initial</code> utilizando los conjuntos de datos <code>X_train</code> e <code>y_train</code>.</li>
<li>Asigne el valor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container> utilizado por <code>ridge_initial</code> a la variable <code>alpha_initial</code>.</li>
<li>Examine el valor de <code>alpha_initial</code>. ¿Qué cree que sugiere el resultado sobre la elección del parámetro de ajuste?</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="21" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h1 id="estandarizaci%C3%B3na-classanchor-id05-standardizationa">Estandarización<a class="anchor" id="05-standardization"></a></h1>
<ul>
<li>Recuerde que los coeficientes de regresión lineal se interpretan como cambios promedio en el resultado de cambios unitarios en las características.</li>
<li>Por lo tanto, la magnitud de estos coeficientes depende en gran medida de la magnitud de la característica.</li>
<li>Esto puede convertirse en un problema si tenemos características de diferentes magnitudes.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="22" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Podemos ver esto en el conjunto de datos <code>housing</code>. La columna <code>housing_median_age</code> está en una escala de 10, pero la columna <code>population</code> se extiende hasta los 1000. Esta diferencia de magnitudes puede tener efectos adversos en modelos regularizados como la regresión de crestas.</li>
</ul>

<li>El término de penalización mira la magnitud de los coeficientes.</li>
<li>El coeficiente de una característica medida en los 1000 se restringirá de manera diferente en comparación con el coeficiente de una característica con una magnitud en los 10.</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="23" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Esto no es deseable porque los coeficientes se penalizarán de forma diferente en función de su escala. Prevenimos este problema haciendo que la escala en todos nuestros coeficientes sea la misma.</li>
<li>Podemos hacer esto <strong>estandarizando</strong> todas las características para que tengan un promedio de <code>0</code> y una desviación estándar de <code>1</code>.</li>
<li>La estandarización es el proceso de transformar todas las características para que todas sean similares de alguna manera.</li>
<li>El acto de transformar el promedio de una variable para que sea '0' también se denomina <strong>centrado</strong>, y transformar la desviación estándar en '1' también se denomina <strong>escalado</strong>.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="24" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Podemos usar una clase útil que ofrece la biblioteca <code>scikit-learn</code>: la <a href="https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.StandardScaler.html?highlight=standard+scaler#sklearn.preprocessing.StandardScaler">clase <code>StandardScaler</code></a> en la biblioteca <code>preprocessing</code>.</li>
<li>Para estandarizar las características, solo necesitamos instanciar un objeto <code>StandardScaler()</code> y crear un nuevo conjunto de datos estandarizado usando el método <code>fit_transform()</code>.</li>
<li>Pasamos un conjunto de datos no estandarizados <code>X</code> al método y reasignamos el conjunto de datos estandarizados devuelto a una nueva variable, <code>standardized_X</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.preprocessing <span class="hljs-keyword">import</span> StandardScaler
scaler = StandardScaler()
standardized_X = scaler.fit_transform(X)
</code></pre>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="25" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h2 id="ejercicio-4">Ejercicio</h2>
<ol>
<li>Importe la clase <code>StandardScaler</code> del módulo <code>preprocessing</code>.</li>
<li>Cree una instancia de un objeto <code>StandardScaler()</code> y asígnelo a la variable <code>scaler</code>.</li>
<li>Estandarice los datos de <code>X_train</code> y asígnelos a la variable <code>standardized_X_train</code>.</li>
<li>Crea una instancia de un modelo <code>RidgeCV()</code>:
<ul>
<li>Cree una matriz de valores para el parámetro <code>alphas</code> que varíe de <code>1</code> a <code>10</code> con <code>100</code> valores espaciados uniformemente.</li>
<li>Asigne el modelo a la variable <code>ridge</code>.</li>
</ul>
</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="26" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ol start="5">
<li>Ajuste este objeto de 'cresta' en las nuevas características estandarizadas y los resultados de entrenamiento originales.</li>
<li>Asigne los coeficientes del modelo <code>ridge</code> a la variable <code>ridge_coefs</code>. Examínelos para confirmar que están en una escala similar.</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="27" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h1 id="el-modelo-lassoa-classanchor-id06-lassoa">El modelo LASSO<a class="anchor" id="06-lasso"></a></h1>
<ul>
<li>Ahora que entendemos cómo implementar la regresión de cresta, podemos ver un modelo estrechamente relacionado: el modelo <strong>LASSO</strong>.</li>
<li>El acrónimo LASSO significa &quot;Operador de selección y contracción mínima absoluta&quot;.</li>
<li>El nombre del modelo indica exactamente lo que hace: contracción y selección.</li>
<li>Al igual que la regresión de cresta, LASSO es un modelo regularizado.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="28" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ul>
<li>Esta regularización proviene de un término de penalización adicional en la función de pérdida.</li>

<header>Regularización</header>
<p><code>scikit-learn</code> implementa LASSO en la <a href="https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LassoCV.html">clase <code>LassoCV</code></a> en el módulo <code>linear_model</code>. También hay una clase <code>Lasso</code>, pero estamos introduciendo <code>LassoCV</code> ya que también optimiza el parámetro de ajuste. Mostramos algunos pseudocódigos a continuación:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> LassoCV
lasso = LassoCV(alphas = linspace(<span class="hljs-number">0.1</span>, <span class="hljs-number">10</span>, num=<span class="hljs-number">100</span>))
lasso.fit(X, y)
</code></pre>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="30" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h2 id="ejercicio-5">Ejercicio</h2>
<ol>
<li>Importe lo siguiente:
<ul>
<li>la clase <code>LassoCV</code> del módulo <code>linear_model</code> de <code>scikit-learn</code></li>
<li>la función <code>mean_squared_error</code> del módulo <code>metrics</code> de <code>scikit-learn</code></li>
</ul>
</li>
<li>Crea una instancia de un objeto <code>LassoCV()</code> y asígnalo a la variable <code>lasso</code>. Usa el mismo argumento <code>alphas</code> que el que usamos para el objeto <code>ridge</code>.</li>
<li>Ajuste el modelo <code>lasso</code> en <code>X_train</code> y <code>y_train</code>, y luego asigne los coeficientes resultantes para el modelo a la variable <code>lasso_coef</code>.</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="31" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<ol>
<li>Calcule el MSE de prueba del modelo de regresión de cresta optimizado y asigne el resultado a la variable <code>ridge_test_mse</code>.</li>
<li>Calcule el MSE de prueba del modelo LASSO optimizado y asigne el resultado a la variable <code>lasso_test_mse</code>.</li>
<li>¿Qué modelo funciona mejor en términos de MSE de prueba? ¿Cómo se comparan los modelos en términos de qué características se incluyen en el modelo?</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-header="Regularización" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp" lang="en-US" data-marpit-pagination="32" style="--header:Regularización;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:62pp97dlscwx91x7tqsq7jsr7pq68wtnnvxzd0xeuxp;" data-marpit-pagination-total="32">
<header>Regularización</header>
<h1 id="conclusi%C3%B3n">Conclusión</h1>
<ul>
<li>La regularización es la simplificación de modelos para generalizarlos mejor a datos no vistos.</li>
<li>Aprendimos sobre dos modelos regularizados: regresión de cresta y LASSO.</li>
<li>Ambos modelos implementan la regularización agregando un término de penalización a la función de pérdida.</li>
<li>Este término de penalización sirve para reducir el valor de los coeficientes.</li>
<li>En el caso de LASSO, algunos coeficientes se pueden reducir a cero, lo que da como resultado la selección de características.</li>
<li>LASSO funciona mejor cuando sospechamos que muchas de las variables que incluimos en el modelo no son útiles.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
