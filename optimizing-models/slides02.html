<h1 id="02-selecci%C3%B3n-secuencial-de-variables">02 Selección secuencial de variables</h1>
<ul>
<li>Cuando exploramos los datos, a menudo usamos visualizaciones para ver cómo las variables individuales se relacionan con el resultado de interés.</li>
<li>Una debilidad de este enfoque es que es difícil considerar cómo cambian estas relaciones a medida que agregamos variables a un modelo.</li>

<footer>Optimización de Modelos</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="6" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<ul>
<li>Hay dos métodos principales de selección secuencial de variables que aprenderemos: <strong>selección hacia adelante</strong> y <strong>selección hacia atrás</strong>.</li>
<li>Ambos métodos producen un modelo con un subconjunto de variables que funcionan bien según alguna métrica, como MSE, pero difieren en su enfoque sobre cómo se eligen las variables.</li>
<li>En la selección directa, comenzamos con un modelo de solo la intercepción (un modelo de regresión sin predictores).</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="7" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<p>La clase que implementa la selección hacia adelante es la <a href="https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.SequentialFeatureSelector.html#sklearn.feature_selection.SequentialFeatureSelector">clase <code>SequentialFeatureSelector</code></a>. Presentaremos un código de ejemplo a continuación:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.feature_selection <span class="hljs-keyword">import</span> SequentialFeatureSelector
<span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> LinearRegression

lm = LinearRegression()

forward_lm = SequentialFeatureSelector(estimator=lm,
                                       n_features_to_select=<span class="hljs-number">2</span>, 
                                       direction=<span class="hljs-string">&quot;forward&quot;</span>)
forward_lm.fit(X, y)
</code></pre>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="8" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<p>Para ver qué variables se incluyeron realmente en el modelo, podemos usar el método <code>get_feature_names_out()</code> después de crear un objeto <code>SequentialFeatureSelector()</code> y llamar al método <code>fit()</code>.</p>
<p>Es fundamental tener en cuenta que el objeto <code>SequentialFeatureSelector()</code> <strong>no crea un modelo con las variables que seleccionó</strong>. Utiliza el &quot;estimador&quot; dado para seleccionar variables, y luego estas variables se pueden usar más tarde para ajustar un modelo.</p>
<p>Para almacenar los nombres de las variables en una matriz llamada <code>variables</code>, utilice la siguiente sintaxis:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">features = forward_lm.get_feature_names_out()
</code></pre>

<footer>Optimización de Modelos</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="10" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<h1 id="03-selecci%C3%B3n-hacia-atr%C3%A1s-backward">03 Selección hacia Atrás (Backward)</h1>
<ul>
<li>La selección hacia atrás luego elimina una sola característica del modelo y vuelve a evaluar la métrica.</li>
<li>El algoritmo repite este proceso para cada característica presente en el modelo completo. Esto da como resultado varias métricas, cada una evaluada en un modelo en el que se elimina un solo predictor.</li>
<li>La selección hacia atrás elige el modelo con la mejor métrica y se repite hasta que alcanzamos el número deseado de variables especificadas por el argumento <code>n_features_to_select</code>.</li>
<li>La clase <code>SequentialFeatureSelector</code> también implementa la selección hacia atrás. Solo necesitamos cambiar el parámetro <code>dirección</code> de &quot;adelante&quot; a &quot;atrás&quot;.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="11" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.feature_selection <span class="hljs-keyword">import</span> SequentialFeatureSelector
<span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> LinearRegression

lm = LinearRegression()

backward_lm = SequentialFeatureSelector(estimator=lm,

                                        direction=<span class="hljs-string">&quot;backward&quot;</span>)
backward_lm.fit(X, y)

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="13" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<h1 id="04-selecci%C3%B3n-basada-en-criterios">04 Selección basada en criterios</h1>
<ul>
<li>La selección hacia adelante y hacia atrás nos brinda algoritmos para seleccionar rápidamente un subconjunto razonable de variables para un modelo candidato.</li>
<li>Estos algoritmos nos permiten crear muchos modelos diferentes, cada uno con un número diferente de variables.</li>
<li>Sabemos que luego podemos comparar estos modelos en función de su error y, en muchos casos, podemos confiar únicamente en los resultados de esta comparación para seleccionar un modelo.</li>
</ul>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="14" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<ul>
<li>
<p>Hay algunas ocasiones en las que podríamos necesitar otra herramienta. Una de esas ocasiones es cuando tenemos datos limitados y, por extensión, no tenemos muchos datos para asignar a un conjunto de prueba.</p>
</li>
<li>
<p>Hay varios criterios que podemos usar, y el primero que veremos es el <a href="https://en.wikipedia.org/wiki/Akaike_information_criterion"><strong>Criterio de información de Akaike</strong></a> (AIC).</p>
</li>
<li>
<p>El criterio de información de Akaike es un valor que estima el error de predicción de un modelo.</p>
</li>
<li>
<p>Dado que generalmente estamos interesados en la capacidad predictiva, el AIC es una herramienta que podemos usar razonablemente para la selección de modelos. Calculamos el AIC así:</p>
</li>
</ul>

<header>Selección Del Modelo</header>
<h2 id="ejercicio-python-3">Ejercicio Python</h2>
<p>Comparemos regresiones lineales de 2 y 5 variables usando el AIC. Hemos proporcionado una función auxiliar, <code>AIC()</code>, que calcula el AIC ya que no existe en <code>scikit-learn</code>.</p>
<ol>
<li>Importe la función <code>mean_squared_error</code> de la biblioteca <code>metrics</code>.</li>
<li>Cree 2 objetos <code>SequentialFeatureSelector()</code> diferentes que implementen la selección <code>&quot;forward&quot;</code> usando el <code>modelo</code> dado. Estos 2 objetos deberían usar las variables <code>2</code> y <code>5</code> respectivamente. Asigne los modelos devueltos a las variables <code>sfs2</code> y <code>sfs5</code>.</li>
<li>Ajuste ambos modelos a los datos (<code>X</code>, <code>y</code>) y obtenga las variables que se utilizan en cada modelo a través del método <code>get_feature_names_out()</code>:
<ul>
<li>Asigne las variables del modelo de 2 variables a <code>features2</code></li>
<li>Asigne las variables del modelo de 5 variables a <code>features5</code></li>
</ul>
</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="16" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<ol start="4">
<li>Ahora que tenemos las variables elegidas por selección directa, creemos los modelos:
<ul>
<li>Usando <code>features2</code> y <code>features5</code>, cree subconjuntos de <code>X</code> que solo contengan esas variables. Nombre estos DataFrames <code>X2</code> y <code>X5</code> respectivamente.</li>
<li>Cree 2 nuevos objetos <code>LinearRegression()</code> llamados <code>lm2</code> y <code>lm5</code>.</li>
<li>Ajuste estos modelos usando los conjuntos de datos <code>X2</code> y <code>X5</code> que hicimos anteriormente.</li>
</ul>
</li>
<li>Obtenga el número total de observaciones en <code>X</code> y asígnelo a la variable <code>n</code>.</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-header="Selección Del Modelo" data-footer="Optimización de Modelos" data-paginate="true" data-heading-divider="2" data-theme="78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u" data-marpit-pagination="17" data-marpit-pagination-total="23" style="--header:Selección Del Modelo;--footer:Optimización de Modelos;--paginate:true;--heading-divider:2;--theme:78hpvu9ealmgade57qtw5q4pk99qx9qc2qgzmvl69u;">
<header>Selección Del Modelo</header>
<ol start="6">
<li>Calcule el MSE para ambos modelos y multiplique ambos valores por <code>n</code> para obtener la suma de los errores cuadráticos (SSE) para ambos modelos. Asigne estos valores a <code>sse2</code> y <code>sse5</code>.</li>
<li>Finalmente, calcule el AIC para ambos modelos utilizando el valor de <code>n</code> y los SSE que calculamos anteriormente. Asigne estos valores a <code>aic2</code> y <code>aic5</code>. En base a este criterio, ¿cuál es el modelo superior?</li>
</ol>
<footer>Optimización de Modelos</footer>
</section>

<h1 id="05-otros-criterios">05 Otros Criterios</h1>

<header>Selección Del Modelo</header>
<h1 id="06-la-maldici%C3%B3n-de-la-dimensionalidad">06 La maldición de la dimensionalidad</h1>
<ul>
<li>Debemos discutir un tema fundamental en el aprendizaje automático: la dimensionalidad.</li>
<li>En <code>housing</code>, el número de observaciones (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container>) supera ampliamente el número de predictores (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container>) en el conjunto de datos.</li>
<li>En este contexto, no hay problemas para crear modelos como regresiones, pero no siempre será así. En otras situaciones, lo contrario podría ser cierto: <strong>una gran cantidad de variables pero una menor cantidad de observaciones</strong>. Cuando esto sucede, decimos que el conjunto de datos tiene <strong>alta dimensionalidad</strong>.</li>
</ul>

<header>Selección Del Modelo</header>
<ul>
<li>Un tema común cuando se trata de una gran dimensionalidad es reducir estratégicamente la cantidad de variables que debemos considerar para el modelo.</li>
<li>Este proceso se denomina <strong>reducción de dimensiones</strong>. Una técnica popular para la reducción de dimensiones es el <strong>análisis de componentes principales</strong> (PCA)</li>
<li>PCA busca reducir las dimensiones de los datos mediante la creación de un nuevo conjunto de datos con variables basadas en los datos originales.</li>
</ul>
<p>Una función creada por PCA se denomina <strong>componente principal</strong>. Una componente principal <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.052ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 465 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D467" d="M347 338Q337 338 294 349T231 360Q211 360 197 356T174 346T162 335T155 324L153 320Q150 317 138 317Q117 317 117 325Q117 330 120 339Q133 378 163 406T229 440Q241 442 246 442Q271 442 291 425T329 392T367 375Q389 375 411 408T434 441Q435 442 449 442H462Q468 436 468 434Q468 430 463 420T449 399T432 377T418 358L411 349Q368 298 275 214T160 106L148 94L163 93Q185 93 227 82T290 71Q328 71 360 90T402 140Q406 149 409 151T424 153Q443 153 443 143Q443 138 442 134Q425 72 376 31T278 -11Q252 -11 232 6T193 40T155 57Q111 57 76 -3Q70 -11 59 -11H54H41Q35 -5 35 -2Q35 13 93 84Q132 129 225 214T340 322Q352 338 347 338Z"></path></g></g></g></svg></mjx-container> es una <em>combinación lineal de las variables originales (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H8 <p><code>scikit-learn</code> implementa PCA bajo la <a href="https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html">clase <code>PCA</code></a> en el módulo <code>decomposition</code>. Cuando instanciamos un objeto <code>PCA()</code>, elegimos el número de componentes principales que queremos crear. Luego, podemos ajustar este objeto <code>PCA()</code> en un conjunto de datos.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.decomposition <span class="hljs-keyword">import</span> PCA
pca = PCA(n_components=<span class="hljs-number">3</span>)
pca.fit(X)
</code></pre>

<header>Selección Del Modelo</header>
<h2 id="ejercicio-python-4">Ejercicio Python</h2>
<ol>
<li>
<p>Importe la clase <code>PCA</code> desde el módulo <code>descomposition</code>.</p>
</li>
<li>
<p>Crea una instancia de un objeto <code>PCA()</code> y asígnalo a la variable <code>pca</code>, utilizando <code>n_components=1</code>.</p>
</li>
<li>
<p>Ajuste el objeto <code>pca</code> en los datos <code>housing</code>.</p>
</li>
<li>
<p>Calcula, como un valor flotante, la cantidad de variación explicada por este objeto <code>pca</code> utilizando el atributo <code>explained_variance_ratio_</code>. Asigne el resultado a <code>var_explained_1</code>.</p>
</li>
<li>
<p>Experimente con el proceso anterior para determinar cuántos componentes principales se necesitan para explicar al menos el 99% de la varianza en los datos de <code>housing</code>. Asigne este valor entero a la variable <code>n_pc_99</code>.</p>
</li>
</ol>

<header>Selección Del Modelo</header>
<h1 id="07-conclusiones">07 Conclusiones</h1>
<ul>
<li>La selección de variables secuenciales y la selección basada en criterios son solo dos estrategias que podemos usar para realizar la selección de modelos.</li>
<li>La selección de variables secuenciales aborda la selección de modelos desde una perspectiva de nivel de característica, mientras que la selección basada en criterios lo hace a nivel de modelo.</li>
<li>También aprendimos sobre la idea de datos de alta dimensión y cómo afecta la selección del modelo.</li>
<li>El análisis de componentes principales es una forma de abordar esto.</li>
</ul>
