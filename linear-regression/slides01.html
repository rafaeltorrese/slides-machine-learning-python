</ul>

</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">features = [<span class="hljs-string">&#x27;length&#x27;</span>, <span class="hljs-string">&#x27;engine_size&#x27;</span>]
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">prediction = beta0 + beta1 * X_train[<span class="hljs-string">&#x27;length&#x27;</span>] + beta2 * X_train[<span class="hljs-string">&#x27;engine_size&#x27;</span>]

</code></pre>

</code></pre>
