</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;">
<header>Flujo de Trabajo</header>
<section class="outstanding-title">El flujo de trabajo del aprendizaje automático</section>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="2" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="introducci%C3%B3n">Introducción</h1>
<p>La Universidad quiere determinar si un nuevo alumno completará o no un curso específico. Estamos seguros de que el curso tiene un buen equilibrio que permite al alumno comprender cualquier concepto aplicándolo. Desafortunadamente, eso no siempre implica que todos completarán un curso.</p>
<p>Entonces, ¿cómo podríamos <em>predecir</em> que un nuevo alumno completará el curso?</p>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="3" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Digamos que hemos recopilado datos de cada alumno actual en el sitio web. Sabemos:</p>
<ul>
<li>Cuántas lecciones han completado anteriormente.</li>
<li>Cuántos de los otros cursos han completado.</li>
<li>Cuántos ejercicios han superado con éxito.</li>
<li>Cuántas horas han dedicado a cada lección individual.</li>
<li>Si ya han completado el curso.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="4" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Quizás, al explorar los datos, encontremos que el &quot;90%&quot; de los estudiantes que completaron el curso:</p>
<ul>
<li>Completó más de <code>L</code> lecciones anteriormente.</li>
<li>Pasó más de <code>H</code> horas, en promedio, por lección.</li>
<li>Aprobó más de los ejercicios <code>E</code>.</li>
<li>Dados estos patrones, ¿podemos decir que un nuevo alumno que satisfaga los criterios anteriores completará ese curso también?</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="5" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Bueno, no podemos garantizarlo. Pero la probabilidad de que eso suceda puede ser alta si el nuevo alumno satisface las reglas anteriores. ¿Qué pasa si aprendemos algo nuevo de los datos que cambie esa probabilidad? Podría bajar o subir.</p>
<p>No siempre podemos identificar estos patrones uno por uno, especialmente cuando tenemos muchos datos. Aquí es exactamente donde el <strong>aprendizaje automático</strong> puede ayudar.</p>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="6" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>
<p>El pequeño conjunto de reglas o criterios que identificamos anteriormente es esencialmente lo que hace un <strong>modelo</strong> de aprendizaje automático sin que nosotros programemos explícitamente esas reglas.</p>
</li>
<li>
<p><strong>Entrenamos</strong> el modelo para que aprenda a identificar esos patrones a partir de los datos por sí solo. Luego usamos el modelo para <strong>predecir</strong> algo dada una entrada nueva, <strong>invisible</strong>.</p>
</li>
<li>
<p>Ese &quot;algo&quot; puede parecer un poco ambiguo, pero lo que queremos predecir <strong>depende del resultado o tarea previsto</strong>.</p>
</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="7" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Lo que aprendimos anteriormente nos brinda una introducción rápida al <strong>flujo de trabajo del aprendizaje automático</strong>:</p>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736888705/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/1.1-m736.svg" class="center" width="1500" height="1500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="8" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="recopilaci%C3%B3n-y-exploraci%C3%B3n-de-datos">Recopilación y exploración de datos</h1>
<p>Construiremos un modelo que prediga si una paciente tiene cáncer de mama. Empezaremos con los datos.</p>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736888973/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/2.1-m736.svg" class="center" width="1500" height="1500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="9" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Si bien es posible, no siempre es factible recopilar nuestros propios datos. Afortunadamente, hay muchos conjuntos de datos disponibles públicamente a los que podemos acceder y trabajar libremente, según el tipo de problema que queramos resolver.</p>
<ul>
<li>Trabajaremos con el <a href="https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+(Diagnostic)" target="_blank">conjunto de datos (diagnóstico) de Wisconsin sobre cáncer de mama</a>.</li>
<li>La biblioteca <code>scikit-learn</code> almacena varios conjuntos de datos, incluido <a href="https://scikit-learn.org/stable/datasets/toy_dataset.html#breast-cancer-dataset">este conjunto de datos sobre cáncer de mama</a>, y nos facilita la carga. y trabajar con ellos.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="10" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>En la primera sección, analizamos qué tipo de datos podría recopilar una Universidad:</p>
<ul>
<li>Cuántos cursos han completado hasta ahora.</li>
<li>Cuántos ejercicios han superado con éxito.</li>
<li>Cuántas horas han dedicado a cada lección.</li>
</ul>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736893949/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/pandas-data-frame.svg" class="center" width="500" height="500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="11" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Cada uno de los anteriores se denomina <strong>característica</strong>. Todos ellos describen o son propiedad de nuestros datos. Cuando trabajamos con datos tabulares, cada <strong>nombre de columna corresponde a una característica</strong>, excepto una:</p>
<ul>
<li>Si un alumno ya ha completado el curso o no.</li>
</ul>
<p>La columna correspondiente a lo anterior se llama <strong>variable objetivo</strong> porque eso es lo que queremos que prediga nuestro modelo. Ese es nuestro objetivo.</p>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736893949/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/pandas-data-frame.svg" class="center" width="350" height="350" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="12" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Cada <strong>fila</strong> de lo anterior contendría <strong>información relacionada con un alumno individual</strong>. Cada una de estas filas se denomina <strong>observación</strong> o <strong>vector de características</strong>. Es un vector de características de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> dimensiones.</p>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736893539/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/finallpandas.png" class="center" width="500" height="500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="13" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Veamos el conjunto de datos con el que trabajaremos. El enlace a nuestro conjunto de datos nos proporciona la siguiente información:</p>
<ul>
<li>Hay un total de <code>30</code> atributos o <code>30</code> características.</li>
<li>Hay un total de <code>569</code> instancias u observaciones.</li>
<li>Hay dos <strong>clases</strong> en la variable de destino:
<ul>
<li><code>WDBC-Maligno</code></li>
<li><code>WDBC-Benigno</code></li>
</ul>
</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="14" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Las dos <strong>clases</strong> o <strong>etiquetas</strong> anteriores nos indican si un paciente tiene un tumor benigno o maligno. Para cada observación, hay una clase o etiqueta correspondiente en nuestros datos.</p>
<p>Carguemos nuestro conjunto de datos usando la función <a href="https://scikit-learn.org/stable/modules/generated/sklearn.datasets.load_breast_cancer.html#sklearn.datasets.load_breast_cancer">load_breast_cancer</a> de scikit-learn. La función devolverá un objeto con varios atributos, algunos de los cuales utilizaremos:</p>
<ul>
<li><code>data</code> almacena los puntos de datos.</li>
<li><code>target</code> almacena el valor <code>0</code> si el tumor es benigno o <code>1</code> si el tumor es maligno.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="15" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h2 id="ejercicio">Ejercicio</h2>
<ol>
<li>Importe las siguientes bibliotecas:
<ul>
<li>pandas como <code>pd</code>.</li>
<li>Desde <a href="https://scikit-learn.org/stable/modules/generated/sklearn.datasets.load_breast_cancer.html#sklearn.datasets.load_breast_cancer">sklearn.datasets</a> importe <code>load_breast_cancer</code></li>
</ul>
</li>
<li>Llame a la función <code>load_breast_cancer()</code>.
<ul>
<li>Pase el parámetro <code>as_frame</code> a la función y configúrelo en <code>True</code>.
<ul>
<li>Esto devolverá el atributo <code>data</code> como un DataFrame de pandas y el atributo <code>target</code> como una Serie.</li>
</ul>
</li>
<li>Guarde la salida en la variable <code>cancer_data</code>.</li>
</ul>
</li>
<li>A una variable <code>cancer_df</code> asigne el atributo <code>data</code> de <code>cancer_data</code>.</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="16" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ol start="4">
<li>Agregue una columna llamada <code>target</code> a <code>cancer_df</code> y asigne el atributo <code>target</code> de <code>cancer_data</code> a esa columna.</li>
<li>Explore el conjunto de datos:
<ul>
<li>Mire las primeras observaciones en el conjunto de datos.</li>
<li>Imprima la forma del conjunto de datos y confirme que la cantidad de características y observaciones sean las mismas que las enumeradas anteriormente.</li>
<li>Calcular e imprimir el número de valores faltantes en cada columna.</li>
<li>Calcular e imprimir el número de pacientes con un tumor benigno y el número de pacientes con un tumor maligno.</li>
<li>Mostrar las estadísticas resumidas del conjunto de datos.</li>
</ul>
</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="17" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> pandas <span class="hljs-keyword">as</span> pd
<span class="hljs-keyword">from</span> sklearn.datasets <span class="hljs-keyword">import</span> load_breast_cancer
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">
cancer_data = load_breast_cancer(as_frame=<span class="hljs-literal">True</span>)
cancer_df = cancer_data.data
cancer_df[<span class="hljs-string">&#x27;target&#x27;</span>] = cancer_data.target
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(cancer_df.info())
<span class="hljs-built_in">print</span>(cancer_df.shape)
<span class="hljs-built_in">print</span>(cancer_df.isnull().<span class="hljs-built_in">sum</span>())
<span class="hljs-built_in">print</span>(cancer_df[<span class="hljs-string">&#x27;target&#x27;</span>].value_counts())
<span class="hljs-built_in">print</span>(cancer_df.describe())
</code></pre>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="18" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="aprendizaje-autom%C3%A1tico-supervisado-clasificaci%C3%B3n">Aprendizaje automático supervisado: clasificación</h1>
<ul>
<li>
<p>En la sección anterior, identificamos que a nuestros datos no les faltan valores. Por ahora, podemos trabajar asumiendo que nuestros datos están limpios y no requieren más discusiones. Siempre es una suposición peligrosa, pero, en esta lección, nos centraremos en explorar el flujo de trabajo del aprendizaje automático desde una perspectiva más amplia.</p>
</li>
<li>
<p>Nuestro siguiente paso es preparar nuestros datos antes de ingresarlos a nuestro modelo. Sin embargo, realmente no hemos discutido qué es este modelo.</p>
</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="19" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890372/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/3.1-m736.png" class="center" width="300" height="300" />
<ul>
<li>Digamos que no sabemos cómo es una jirafa.</li>
<li>Alguien nos muestra una foto de una jirafa y somos capaces de identificar algunas características que creemos que son exclusivas de una jirafa.</li>
<li>Esa es la intuición detrás del subconjunto del aprendizaje automático: <strong>aprendizaje automático supervisado</strong>.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="20" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Está supervisado porque nuestro modelo aprende de los datos existentes <em>y</em> las etiquetas correspondientes. Generalmente son dos tipos de etiquetas las que nos encontramos:</p>
<ul>
<li>Etiquetas continuas.
<ul>
<li>Por ejemplo, podríamos estar trabajando con un conjunto de datos que contenga características que describan diferentes tipos de automóviles, y las etiquetas podrían ser el precio de esos automóviles. Nuestro modelo aprendería entonces a predecir el precio de un automóvil, teniendo en cuenta esas características.</li>
</ul>
</li>
<li>Etiquetas categóricas.
<ul>
<li>Nuestro conjunto de datos sobre cáncer de mama tiene solo dos etiquetas: &quot;benigno&quot; y &quot;maligno&quot;, o &quot;0&quot; y &quot;1&quot;. Cada observación se clasifica por su propia etiqueta o clase.</li>
</ul>
</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="21" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Si la etiqueta o el objetivo que queremos predecir es un valor categórico, lo llamamos tarea de <strong>clasificación</strong>. El modelo, un <strong>clasificador</strong>, intentará clasificar un conjunto determinado de entradas en una categoría. Existen otros tipos de modelos de aprendizaje automático que se pueden utilizar para diferentes tipos de tareas.</li>
<li>Entonces, ¿qué aprende exactamente el modelo de los datos? Esto depende del algoritmo de aprendizaje automático que terminemos usando para nuestro modelo.</li>
</ul>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890456/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/3.2-m736.svg" class="center" width="500" height="500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="22" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890456/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/3.2-m736.svg" class="center" width="900" height="900" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="23" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Los puntos en los gráficos anteriores son nuestras características en un espacio bidimensional.</li>
<li>Este espacio se llama <strong>espacio de características</strong> y los colores representan las etiquetas.</li>
<li>La línea que vemos es un <strong>límite de decisión</strong> y divide el espacio de características en dos.</li>
<li>Los puntos a un lado del límite pertenecen a una clase y los puntos al otro lado del límite pertenecen a la otra clase.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="24" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Ese límite de decisión es nuestro clasificador. Como solo tenemos dos etiquetas, se llama <strong>clasificador binario</strong>. Si tuviéramos más etiquetas, sería un <strong>clasificador multiclase</strong>.</p>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890511/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/3.3-m736.svg" class="center" width="800" height="800" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="25" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Si tuviéramos más características, tendríamos un espacio de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> dimensiones y el límite de decisión sería un hiperplano en lugar de una línea. ¿Pero de dónde viene esa línea?</li>
<li>Sabemos que una recta o una curva se pueden definir mediante una ecuación paramétrica.</li>
<li>Eso es lo que el modelo intenta aprender: <strong>los parámetros de esa ecuación</strong>.</li>
<li>El modelo estima esos parámetros a partir de los datos y esos parámetros estimados definen el límite de decisión.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="26" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="preparaci%C3%B3n-de-datos">Preparación de datos</h1>
<ul>
<li>Los datos que utilizamos para entrenar nuestro modelo se denominan <strong>datos de entrenamiento</strong>, <strong>conjunto de entrenamiento</strong> o <strong>conjunto de datos de entrenamiento</strong>.</li>
<li>Los datos invisibles, como sugiere el nombre, son datos que nuestro modelo no ha visto antes.</li>
<li>El modelo no se ha entrenado con esos datos y solo los utilizará y predecirá una etiqueta para ellos.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="27" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Estos datos invisibles se denominan <strong>datos de prueba</strong>, <strong>conjunto de prueba</strong> o <strong>conjunto de datos de prueba</strong>.</li>
<li>Se utiliza para evaluar el rendimiento del modelo.</li>
<li>Como no tenemos datos adicionales para usar como conjunto de prueba, podemos seleccionar aleatoriamente un pequeño conjunto de observaciones de nuestro conjunto de datos original y dejarlo a un lado.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="28" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>A continuación, prepararemos nuestros conjuntos de datos de entrenamiento y prueba utilizando la función <a href="https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html"><code>train_test_split</code></a> de scikit-learn. Este proceso tendrá dos etapas:</p>
<ol>
<li>La función espera las columnas de características y la columna de destino como entradas. Si miramos los ejemplos en la documentación, esos dos se pasan a la función como <code>X</code> e <code>y</code>. A medida que trabajemos más con la biblioteca, notaremos esta convención con frecuencia: los datos de entrada generalmente se almacenan en <code>X</code> y la variable de destino se almacena en <code>y</code>. Seguiremos la misma convención aquí.</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="29" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ol start="2">
<li>
<p>La función dividirá el conjunto de datos en un conjunto de entrenamiento y un conjunto de prueba en función de una proporción que decidamos. Por lo general, el tamaño del conjunto de prueba es aproximadamente del &quot;15&quot; al &quot;20&quot; por ciento del del conjunto de datos. Diferentes factores, como el tamaño del conjunto de datos original, también pueden influir a la hora de decidir ese porcentaje.</p>
<ul>
<li>La función divide los datos aleatoriamente en cada conjunto. Aprenderemos por qué esto es relevante en una lección futura.</li>
<li>La salida de <code>train_test_split()</code> es una lista que contiene 4 elementos:
<ul>
<li>Las características del conjunto de entrenamiento.</li>
<li>Las características del equipo de prueba.</li>
<li>Las etiquetas del conjunto de entrenamiento.</li>
<li>Las etiquetas del conjunto de prueba.</li>
</ul>
</li>
</ul>
</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="30" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h2 id="ejercicio-1">Ejercicio</h2>
<ol>
<li>Importe <code>train_test_split</code> desde <a href="https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html">sklearn.model_selection</a></li>
<li>Guarde las columnas de características en la variable <code>X</code>.
<ul>
<li>Tenga en cuenta que <code>X</code> <em>no</em> debe contener la columna de destino.</li>
</ul>
</li>
<li>Guarde la columna de destino en la variable <code>y</code>.</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="31" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ol start="4">
<li>Llame a la función <code>train_test_split()</code> y pásele los siguientes parámetros:
<ul>
<li><code>X</code></li>
<li><code>y</code></li>
<li><code>tamaño_prueba=0.15</code></li>
<li><code>estado_aleatorio=417</code>
<ul>
<li>Dado que los datos se dividen aleatoriamente, establecer un <code>random_state</code> en un número específico nos permite reproducir los mismos resultados cada vez que ejecutamos el código.</li>
</ul>
</li>
</ul>
</li>
<li>Guarde la salida de la función en las variables <code>X_train, X_test, y_train, y_test</code>.</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="32" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> train_test_split
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">X  = cancer_df.iloc[:, :-<span class="hljs-number">1</span>]
y = cancer_df[<span class="hljs-string">&#x27;target&#x27;</span>]

X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=<span class="hljs-number">0.15</span>, random_state=<span class="hljs-number">417</span>)
</code></pre>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="33" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="construyendo-y-entrenando-un-clasificador">Construyendo y entrenando un clasificador</h1>
<p>¡Ya tenemos listos nuestros datos de entrenamiento! Ahora podemos entrenar un modelo.</p>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890561/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/5.1-m736.svg" class="center" width="1500" height="1500" />
<p><code>scikit-learn</code> ofrece <a href="https://scikit-learn.org/stable/supervised_learning.html">muchos modelos de aprendizaje automático</a>. Podemos elegir cualquiera de los modelos de clasificación y usarlo de inmediato.</p>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="34" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Usaremos el modelo <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html">Clasificación de vectores de soporte lineal</a>.</li>
<li>Podemos consultar la documentación para ver qué tipo de parámetros de entrada puede tomar.</li>
<li><code>scikit-learn</code> nos facilita el uso del modelo sin necesidad de comprender los detalles minuciosos del algoritmo. Lo observaremos pronto.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="35" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Solo hay dos pasos para construir y entrenar el modelo:</p>
<ol>
<li>
<p>Primero creamos una instancia del modelo. Esto es similar a cómo crearíamos una instancia de una clase de Python.</p>
<ul>
<li>Este paso no toma ningún dato de entrenamiento como entrada. Sin embargo, podemos definir y establecer los valores de los parámetros que vimos en la documentación vinculada anteriormente.</li>
</ul>
</li>
<li>
<p><strong>Ajustamos</strong> el modelo a las características de los datos de entrenamiento (<code>X</code>) y las etiquetas (<code>y</code>). Ajustar el modelo es lo mismo que entrenar nuestro modelo.</p>
</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="36" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h2 id="ejercicio-2">Ejercicio</h2>
<ol>
<li>Desde <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn-svm-linearsvc">sklearn.svm</a> importe <code>LinearSVC</code></li>
<li>Cree una instancia de <code>LinearSVC</code> y asígnela al <code>model</code>. Pase los siguientes parámetros al crear una instancia:
<ul>
<li><code>penalty=&quot;l2&quot;</code></li>
<li><code>loss=&quot;hinge&quot;</code></li>
<li><code>C=10</code></li>
<li><code>random_state=417</code>
<ul>
<li>Esto asegura que el resultado sea reproducible.</li>
</ul>
</li>
</ul>
</li>
<li>Llame a <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn.svm.LinearSVC.fit">model.fit()</a> y pase los siguientes parámetros al función:
<ul>
<li><code>X_train</code></li>
<li><code>y_train</code></li>
</ul>
</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="37" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">model = LinearSVC(
    penalty=<span class="hljs-string">&quot;l2&quot;</span>, 
    loss=<span class="hljs-string">&quot;hinge&quot;</span>, 
    C=<span class="hljs-number">10</span>, 
    random_state=<span class="hljs-number">417</span>,
)


model.fit(X_train, y_train)
</code></pre>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="38" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="evaluaci%C3%B3n-del-modelo-en-el-conjunto-de-prueba-i">Evaluación del modelo en el conjunto de prueba I</h1>
<p>¿Cómo podemos medir el rendimiento de un modelo?</p>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890620/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/6.1-m736.svg" class="center" width="1500" height="1500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="39" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Una de las formas más comunes de evaluar un clasificador es observar qué tan precisas son sus predicciones.</li>
<li>Para una tarea de aprendizaje supervisado, <strong>ya sabemos a qué clase pertenece</strong> una observación en particular.</li>
<li>Podemos usar nuestro modelo para predecir las etiquetas de nuestros datos de prueba.</li>
<li>Luego podemos calcular la precisión de nuestro modelo comparando esas predicciones con las etiquetas reales. Pero no necesitamos hacerlo solos.</li>
<li><code>scikit-learn</code> proporciona un método <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn.svm.LinearSVC.score"><code>score()</code></a> que puede calcular esa precisión.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="40" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h2 id="ejercicio-3">Ejercicio</h2>
<ol>
<li>Llame a <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn.svm.LinearSVC.score">model.score()</a>, asígnelo a <code>test_accuracy</code> y pase los siguientes parámetros:
<ul>
<li><code>X_test</code></li>
<li><code>y_test</code></li>
</ul>
</li>
<li>Imprima la puntuación de precisión obtenida de la llamada a la función anterior.</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">test_accuracy = model.score(X_test, y_test)
<span class="hljs-built_in">print</span>(test_accuracy)
</code></pre>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="41" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="afinando-el-modelo">Afinando el modelo</h1>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890663/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/7.1-m736.svg" class="center" width="1500" height="1500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="42" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Cuando creamos una instancia del modelo <code>LinearSVC</code>, definimos los siguientes parámetros:</p>
<ul>
<li><code>penalty=&quot;l2&quot;</code></li>
<li><code>loss=&quot;hinge&quot;</code></li>
<li><code>C=10</code></li>
</ul>
<p>Si bien no sabemos qué implican estos valores para nuestro modelo, podemos experimentar con ellos.</p>
<p>En un intento por mejorar nuestro resultado, haremos lo siguiente:</p>
<ul>
<li>Cambie los valores a uno de los parámetros anteriores.</li>
<li>Agregue y configure otro parámetro de la <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn-svm-linearsvc">documentación</a>.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="43" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h2 id="ejercicio-4">Ejercicio</h2>
<ol>
<li>Cree una instancia de <code>LinearSVC</code> y asígnela al <code>modelo</code>. Pase los siguientes parámetros al crear una instancia:
<ul>
<li><code>penalty=&quot;l2&quot;</code></li>
<li><code>loss=&quot;squared_hinge&quot;</code></li>
<li><code>C=10</code></li>
<li><code>max_iter=3500</code></li>
<li><code>random_state=417</code>
<ul>
<li>Esto asegura que el resultado sea reproducible.</li>
</ul>
</li>
</ul>
</li>
<li>Llame a <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn.svm.LinearSVC.fit">model.fit()</a> y pase los siguientes parámetros al función:
<ul>
<li><code>X_train</code></li>
<li><code>y_train</code></li>
</ul>
</li>
</ol>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="44" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">model = LinearSVC(
    penalty=<span class="hljs-string">&#x27;l2&#x27;</span>,
    loss=<span class="hljs-string">&quot;squared_hinge&quot;</span>,
    C=<span class="hljs-number">10</span>,    
    max_iter=<span class="hljs-number">3500</span>,
    random_state=<span class="hljs-number">417</span>,
)

model.fit(X_train, y_train)
</code></pre>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="45" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="evaluaci%C3%B3n-del-modelo-en-el-conjunto-de-pruebas-ii">Evaluación del modelo en el conjunto de pruebas II</h1>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736890710/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/8.1-m736.svg" class="center" width="600" height="600" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="46" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Podemos notar que hay puntos amarillos en el lado izquierdo y morados en el lado derecho del límite de decisión. Lo anterior pretende ser una representación simplificada de cómo el límite de decisión no siempre puede capturar la complejidad de los datos.</li>
<li>¿Qué sucede cuando agregamos un punto al gráfico anterior? ¿Se clasificará correctamente?</li>
<li>No podemos estar seguros. <strong>Nuestro modelo no va a ser perfecto</strong>.</li>
<li>No nos dará una precisión del &quot;100%&quot;, incluso si seguimos experimentando con diferentes valores de parámetros.</li>
<li>Veamos cómo se desempeña nuestro modelo actualizado en el conjunto de prueba.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="47" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<img src="https://res.cloudinary.com/rafaeltorrese/image/upload/v1736892539/machine-learning-in-python/01-introduction-to-supervised-machine-learning-in-python/01-the-machine-learning-workflow/8.2-m736.svg" class="center" width="1500" height="1500" />
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="48" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h2 id="ejercicio-5">Ejercicio</h2>
<ol>
<li>Llame a <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn.svm.LinearSVC.score">model.score()</a>, asígnelo a <code>test_accuracy</code> y pase los siguientes parámetros:
<ul>
<li><code>X_test</code></li>
<li><code>y_test</code></li>
</ul>
</li>
<li>Imprima la puntuación de precisión obtenida de la llamada a la función anterior.</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">test_accuracy = model.score(X_test, y_test)
<span class="hljs-built_in">print</span>(test_accuracy)
</code></pre>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="49" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="experimentaci%C3%B3n-vs-fundamentos">Experimentación vs Fundamentos</h1>
<p>Simplemente jugando con un par de parámetros, pudimos mejorar el rendimiento de nuestro modelo. Nuestro modelo ahora es mejor para predecir si una paciente tiene cáncer de mama.</p>
<p>Es realmente sorprendente cómo logramos:</p>
<ul>
<li>Entrene un modelo seleccionado al azar de scikit-learn.</li>
<li>Experimente con algunos de sus parámetros y</li>
<li>Conseguir que prediga, con una precisión razonablemente alta, si una paciente tiene cáncer de mama.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="50" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<p>Logramos hacer eso sin entender:</p>
<ul>
<li>Qué hace realmente el modelo.</li>
<li>Para qué sirven los diferentes parámetros de ese modelo.</li>
<li>Cuáles son la mayoría de las características del conjunto de datos.</li>
<li>¿Recuerdas que configuramos <code>max_iter</code> en <code>3500</code>? Si lo hubiéramos configurado en <code>3000</code></li>
</ul>
<p>Hay <code>12</code> parámetros en <a href="https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html#sklearn-svm-linearsvc"><code>LinearSVC</code> de <code>scikit-learn</code></a>.</p>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="51" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>¿Con cuántos de esos parámetros podríamos experimentar?</li>
<li>¿Qué posibles permutaciones y combinaciones de valores podríamos haber probado?</li>
<li>¿Qué pasa si bajamos <code>C</code> en lugar de aumentarlo? ¿Qué hace realmente <code>C</code> en el modelo? ¿Reducirlo haría que nuestro modelo funcionara mejor en el conjunto de prueba?</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="52" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>Si obtuviéramos más datos con algunas características nuevas, ¿nuestros valores seleccionados producirían resultados similares o tendríamos que volver a realizar el proceso?</li>
<li>¿Qué pasaría si en su lugar tuviéramos millones de observaciones? ¿Podríamos permitirnos ejecutar cualquier modelo tantas veces como desee en un conjunto de datos tan grande? ¿Qué modelo sería adecuado para un conjunto de datos tan grande?</li>
<li>¿Qué pasaría si siguiéramos probando modelos aleatorios con parámetros aleatorios, pero hubiera un problema con el conjunto de datos en sí? ¿Qué pasaría si hubiéramos podido identificar si algunas de las características eran más relevantes o viceversa? ¿Eso nos habría ayudado más que probar todos esos modelos, o nos habría empeorado las cosas?</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="53" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<ul>
<li>La experimentación y la iteración mediante aplicación directa tienen su lugar en el campo del aprendizaje automático.</li>
<li>Sin embargo, tratar de lograr resultados buenos o excelentes dadas ciertas limitaciones es una tarea desafiante.</li>
<li>La experimentación ciega no nos llevará muy lejos.</li>
<li>Comprender los fundamentos o comprender cómo funciona un algoritmo de aprendizaje automático &quot;tras bambalinas&quot;.</li>
<li>Puede permitirnos experimentar e iterar desde una perspectiva informada.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-paginate="true" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" data-marpit-pagination="54" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--paginate:true;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;" data-marpit-pagination-total="55">
<header>Flujo de Trabajo</header>
<h1 id="conclusi%C3%B3n">Conclusión</h1>
<p>En esta lección, aprendimos sobre:</p>
<ul>
<li>Aprendizaje automático, aprendizaje automático supervisado y clasificación.</li>
<li>Flujo de trabajo de aprendizaje automático y cómo establecer uno usando scikit-learn.</li>
<li>Creación de prototipos de un clasificador binario utilizando scikit-learn.</li>
<li>Limitaciones de la experimentación en aprendizaje automático sin comprender primero algunos de los fundamentos.</li>
</ul>
<footer>Introducción al Aprendizaje Supervisado</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-header="Flujo de Trabajo" data-footer="Introducción al Aprendizaje Supervisado" data-heading-divider="2" data-theme="qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc" lang="en-US" style="--header:Flujo de Trabajo;--footer:Introducción al Aprendizaje Supervisado;--heading-divider:2;--theme:qukt4hcr3kl4s3cf2gb4fe1tf85am6i9wptf2kohdwc;">
